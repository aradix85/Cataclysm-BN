# Fork-only build recipe for the bn-access accessibility work.
#
# Upstream's matrix workflow builds nine platform configurations. This fork is
# played on Windows with NVDA, so only two of those answer a question we care
# about: does it build and pass its tests on Windows, and does the non-Windows
# side of the speech code still compile at all. Linux answers the second one,
# because the text-to-speech engine sits behind a _WIN32 switch that nothing
# else in this project ever compiles.
#
# There is one branch, main, and every push to it builds, tests, and publishes:
# the tilesets and mods are bundled and the result is written into the rolling
# "experimental" release, so one fixed address always holds the newest playable
# Windows build. Publishing happens only after the build and the tests pass, so
# a broken push never replaces the playable version that is already there.
# A run can also be started by hand from the Actions tab.
#
# Translations are left out on purpose: upstream fetches them from a
# translation service with a token this fork does not have.
#
# This is a new file on purpose. It never conflicts when merging upstream,
# unlike editing their matrix workflow would.

name: bn-access build

on:
  push:
    branches: [main]
    paths-ignore: [docs/**, scripts/**, "**.md", "**.mdx"]
  workflow_dispatch:

# One run per branch. A newer push makes an older run pointless.
concurrency:
  group: bn-access-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows and Linux
    # Writing the packaged build into the release needs more than the token is
    # handed by default, which is read-only. Asked for here rather than by
    # loosening the repository-wide default, so nothing else gains write access.
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      version-label: experimental
      mode: ci
      matrix-json: |
        [
          { "name": "Windows MSVC", "platform": "windows", "artifact": "windows-tiles-x64-msvc", "os": "windows-2022", "arch": "x64", "tiles": true, "sound": true, "ext": "zip", "content-type": "application/zip", "upload-artifact": true },
          { "name": "Linux Tiles", "platform": "linux", "artifact": "linux-tiles-x64", "os": "ubuntu-latest", "tiles": true, "sound": true, "ext": "tar.gz", "content-type": "application/gzip", "upload-artifact": true }
        ]
      download-translations: false
      bundle-tilesets: false
      bundle-registry-mods: true
      package-artifacts: true
      run-tests: true
      android-localize: false
      upload-to-release: true
      upload-artifacts: true
    secrets: inherit

  # Two notes on what the release carries, because both flags above look like
  # things that could simply be turned off, and one of them cannot.
  #
  # bundle-registry-mods stays on. On Windows this step is the only thing in the
  # job that ever runs Deno, and the action that sets Deno up fails in its own
  # cleanup when nothing used it, which marks an otherwise healthy build as
  # failed. What it bundles is decided by data/mods/external.json, not by this
  # flag: the step runs the bundler either way, and running it is what keeps the
  # cleanup quiet, so the list can be as short as the fork wants. It holds one
  # entry, the soundpack, which is the only registry package a player without
  # sight has any use for. The rest -- a tileset, a Korean squirrel mod,
  # Cataclysm++ -- were dead weight in a download aimed at blind players.
  #
  # bundle-tilesets is off. It downloaded two CDDA tilesets into the package,
  # and the clone already carries eleven of its own, so the only thing turning
  # it off costs is package size and one network dependency in every build.

  # The EmmyLua analyser, judged rather than merely run.
  #
  # The shared build file already runs it on the Linux job, over the whole clone
  # and with continue-on-error, so its output is a wall of upstream findings that
  # can never fail anything and that nobody reads. This job reads it: the same
  # analyser, the same annotations, and build-scripts/bn_access_luacheck.py to
  # keep only data/access and to count the two families that are permanent
  # there. The same script runs on the owner's machine through werk\luacheck.ps1,
  # so a local check and this one cannot drift apart.
  #
  # It reports rather than gates, and that is deliberate. A require that is
  # genuinely broken stops the layer from loading, and the C++ suite already
  # fails on that before anything is published. What is left for the analyser is
  # the quieter class -- a field that does not exist, a type that does not match
  # in a branch that rarely runs -- which is worth knowing about and is not worth
  # withholding a playable build for.
  #
  # It reuses the annotations the build already generated and uploaded, so no
  # second build of the game is needed to typecheck against a current surface.
  luacheck:
    name: Lua analysis, ours only
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the annotations the build generated
        uses: actions/download-artifact@v4
        with:
          name: lua-docs

      - name: Setup EmmyLua checker
        uses: scarf005/emmylua_check_action@v1.0.3
        with:
          version: "0.22.0"
          token: ${{ github.token }}

      - name: Check the accessibility layer
        run: |
          emmylua_check . > emmylua-raw.txt 2>&1 || true
          python3 build-scripts/bn_access_luacheck.py emmylua-raw.txt \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emmylua-report
          path: emmylua-raw.txt

  # Upstream's packaging step always makes a second, soundless Windows zip
  # alongside the full one. Turning that off would mean editing their build
  # file, which is exactly the kind of change that conflicts at every merge, so
  # the extra package is removed here afterwards instead. Failure to delete is
  # ignored on purpose: a missing file is not a reason to fail a good build.
  tidy-release:
    name: Keep only the full package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove the soundless Windows package from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset experimental \
            cbn-windows-tiles-x64-msvc-no-soundpack-experimental.zip \
            --repo "${{ github.repository }}" --yes || true
